name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

defaults:
  run:
    working-directory: apps/yagye_core

jobs:
  ci:
    name: Format · Credo · Sobelow · Dialyzer · Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yagye_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: apps/yagye_core/deps
          key: deps-${{ runner.os }}-${{ hashFiles('apps/yagye_core/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: apps/yagye_core/_build
          key: build-${{ runner.os }}-${{ hashFiles('apps/yagye_core/mix.lock') }}
          restore-keys: build-${{ runner.os }}-

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: apps/yagye_core/priv/plts
          key: plts-${{ runner.os }}-otp28-elixir1.19-${{ hashFiles('apps/yagye_core/mix.lock') }}
          restore-keys: plts-${{ runner.os }}-otp28-elixir1.19-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run Sobelow
        run: mix sobelow --config --exit Low

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --warnings-as-errors

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Mix dependencies ==="
          mix deps
          echo "=== Last 50 lines of mix test output ==="
          mix test 2>&1 | tail -50 || true
        working-directory: apps/yagye_core
