stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    # Floci (local AWS emulator) backs trace storage in dev.
    # In production, swap endpoint for the real S3 regional endpoint,
    # insecure: false, and supply real credentials via IAM / secrets manager.
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: floci:4566
      region: us-east-1
      access_key: test
      secret_key: test
      insecure: true             # no TLS against Floci
      forcepathstyle: true       # required for LocalStack-compatible endpoints
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
