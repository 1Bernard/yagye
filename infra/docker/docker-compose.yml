services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data

  redpanda:
    image: redpandadata/redpanda:v24.3.16
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr http://0.0.0.0:8081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
    ports:
      - "9092:9092"    # Kafka protocol (app containers use service name, not this)
      - "19092:19092"  # Kafka protocol (host machine / IDE tools)
      - "8081:8081"    # Schema registry
      - "9644:9644"    # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - data

  redpanda_console:
    image: redpandadata/console:latest
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - data

  # ---------------------------------------------------------------------------
  # Application services
  #
  # Network topology (enforced at the Docker network layer):
  #
  #   data      — db + redpanda only. Every app that needs DB or broker access.
  #   core_mesh — Core ↔ Simulator. Core calls Simulator as its payment gateway
  #               in test/sandbox mode; Simulator may callback to Core.
  #   edge      — Portal → Core HTTP only. The single permitted ingress path
  #               from Portal into the backend.
  #
  # What this prevents:
  #   Portal cannot reach Simulator (no shared network).
  #   Simulator cannot reach Portal (no shared network).
  #   Karafka consumer cannot make HTTP calls to Core or Portal (data only).
  #
  # Note: DB-level isolation (which app can access which database) is enforced
  # by separate Postgres roles in production. Locally we use one superuser for
  # convenience — the network model documents the production intent.
  #
  # During active development, running apps natively is faster (hot reload):
  #   docker compose up db redpanda
  # ---------------------------------------------------------------------------

  yagye_core:
    build:
      context: ../../apps/yagye_core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/yagye_core_dev
      SECRET_KEY_BASE: dev_secret_key_base_replace_in_production_min_64_chars_long_abc123
      CORE_PORTAL_SERVICE_SECRET: dev_portal_service_secret_change_in_production
      CORE_CHECKOUT_SERVICE_SECRET: dev_checkout_service_secret_change_in_production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379/0
      PORT: "4000"
      PHX_HOST: localhost
      # P18 — Observability: send OTLP traces to Alloy
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_RESOURCE_ATTRIBUTES: service.name=yagye_core,deployment.environment=local
      # P21 — Floci (local AWS emulator)
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_HOST: floci
      AWS_S3_PORT: "4566"
      KYB_S3_BUCKET: yagye-kyb-documents
      # Checkout service — public URL as seen by browsers (host-side port mapping)
      CHECKOUT_BASE_URL: "http://localhost:4010"
      # P20 — Scoring service (shadow mode; rollout percent stays 0 until post-P22)
      SCORING_SERVICE_URL: http://yagye_scoring:8000
    # Run migrations then start server. YagyeCore.Release.migrate/0 is idempotent.
    command: >
      /bin/sh -c "
        /app/bin/yagye_core eval 'YagyeCore.Release.migrate()' &&
        /app/bin/yagye_core start
      "
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      floci:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data          # PostgreSQL access
      - core_mesh     # Core ↔ Simulator calls
      - edge          # Receives HTTP calls from Portal
      - observability # Sends OTLP to Alloy; Alloy scrapes /metrics

  yagye_simulator:
    build:
      context: ../../apps/yagye_simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/gateway_simulator_dev
      SECRET_KEY_BASE: dev_secret_key_base_replace_in_production_min_64_chars_long_abc123
      CORE_API_URL: http://yagye_core:4000
      PORT: "4001"
      PHX_HOST: localhost
      DB_SSL_VERIFY_NONE: "1"
    command: >
      /bin/sh -c "
        /app/bin/simulator eval 'Simulator.Release.migrate()' &&
        /app/bin/simulator start
      "
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy
      yagye_core:
        condition: service_healthy
    networks:
      - data       # PostgreSQL access
      - core_mesh  # Core ↔ Simulator calls
    # NOT on edge — Simulator has no business reaching Portal

  yagye_checkout:
    build:
      context: ../../apps/yagye_checkout
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/yagye_checkout_dev
      SECRET_KEY_BASE: dev_secret_key_base_replace_in_production_min_64_chars_long_abc123
      PORT: "4010"
      PHX_HOST: localhost
      CORE_BASE_URL: http://yagye_core:4000
      CORE_CHECKOUT_SERVICE_SECRET: dev_checkout_service_secret_change_in_production
    ports:
      - "4010:4010"
    depends_on:
      yagye_core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - core_mesh  # Calls Core to initiate / poll payments
      - edge       # Receives traffic from the public internet (customer browser)
    # NOT on data — checkout never touches the DB directly; all state is in Core

  yagye_portal:
    build:
      context: ../../apps/yagye_portal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/yagye_portal_development
      CACHE_DATABASE_URL: postgresql://postgres:postgres@db/yagye_portal_development
      QUEUE_DATABASE_URL: postgresql://postgres:postgres@db/yagye_portal_development
      CABLE_DATABASE_URL: postgresql://postgres:postgres@db/yagye_portal_development
      SECRET_KEY_BASE: dev_secret_key_base_replace_in_production_min_64_chars_long_abc123
      RAILS_MASTER_KEY: ""
      REDIS_URL: redis://redis:6379/1
      CORE_API_URL: http://yagye_core:4000
      CORE_PORTAL_SERVICE_SECRET: dev_portal_service_secret_change_in_production
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RAILS_LOG_TO_STDOUT: "true"
      RUBY_IO_BUFFERING: "0"
      PORTAL_ORIGIN: http://localhost:3000
    ports:
      - "3000:80"  # Thruster listens on :80 inside the container
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      yagye_core:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - data  # Portal DB (portal_* read models) + Redpanda bootstrap
      - edge  # Portal → Core HTTP via CoreApiClient
    # NOT on core_mesh — Portal must go through Core's API, never Simulator directly

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - data

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"    # AMQP — host:5673 → container:5672 (5672 clashes with Docker Desktop VPN-kit on some machines)
      - "15673:15672"  # Management UI — http://localhost:15673 (15672 held by Docker Desktop VPN-kit)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - data

  # P21 — Local AWS emulator: S3 + KMS for KYB documents
  # All AWS services (S3, KMS, Secrets Manager, etc.) run on a single port 4566.
  # FLOCI_HOSTNAME must match the Compose service name so that URLs embedded in
  # responses (e.g. presigned URLs) use the service name, not localhost.
  #
  # Docker socket: required for Floci to launch real-engine sidecar containers
  # (Athena/DuckDB, Lambda runtimes, RDS Postgres/MySQL, ElastiCache Redis, etc.).
  # Without it those services show as unavailable in the Floci UI. The socket is
  # read-write so Floci can manage container lifecycle; this is equivalent to
  # giving Floci Docker-in-Docker capability — acceptable for local dev only.
  floci:
    image: floci/floci:latest
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Disable the auto-launched UI container — port 4500 is occupied on this machine.
      # Browse S3 via the AWS CLI (aws --endpoint-url http://localhost:4566 s3 ls)
      # or via the Jupyter notebook + boto3 at localhost:8888.
      FLOCI_SERVICES_UI_ENABLED: "false"
    volumes:
      - floci_data:/app/data
    networks:
      - data

  # P21 — Floci web console at localhost:4501
  # Mapped to 4501 (not 4500) because 4500 is occupied on this machine by another process.
  # FLOCI_SERVICES_UI_ENABLED=false on the floci service stops it from also trying to
  # auto-launch a UI container on 4500 — this service is the single UI owner.
  floci_ui:
    image: floci/floci-ui:latest
    restart: unless-stopped
    ports:
      - "4501:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
    depends_on:
      - floci
    networks:
      - data

  # ---------------------------------------------------------------------------
  # Data lake ETL — Bronze → Silver → Gold
  #
  # Reads NDJSON files written to Floci by yagye_core's DataLakeIngestionWorker,
  # runs DuckDB ETL to produce typed Silver Parquet, then aggregates to Gold.
  # LLM enrichment (Anthropic) runs as part of Silver for disputes and KYB text.
  #
  # Bronze ingestion itself is handled by yagye_core (Oban DataLakeIngestionWorker).
  # This service only handles Silver and Gold — it never touches PostgreSQL.
  # ---------------------------------------------------------------------------

  yagye_data:
    build:
      context: ../../apps/yagye_data
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      # S3 / Floci
      S3_ENDPOINT_URL: http://floci:4566
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_REGION: us-east-1
      BRONZE_BUCKET: yagye-lake-raw
      SILVER_BUCKET: yagye-lake-silver
      GOLD_BUCKET: yagye-lake-gold
      ML_MODELS_BUCKET: yagye-ml-models
      # LLM enrichment (set ANTHROPIC_API_KEY in a .env file at the compose root)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # MLflow experiment tracking — artifacts are served by the MLflow server itself
      MLFLOW_TRACKING_URI: http://mlflow:5001
    # Silver runs every hour; Gold runs every 6 hours.
    # In production these are separate ECS scheduled tasks with distinct schedules.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "i=0;
       while true; do
         python scripts/run_silver_etl.py;
         if [ $$(( i % 6 )) -eq 0 ]; then
           python scripts/run_gold_etl.py;
         fi;
         i=$$(( i + 1 ));
         sleep 3600;
       done"
    depends_on:
      floci:
        condition: service_started
      yagye_core:
        condition: service_healthy  # core must be writing Bronze before ETL starts
    networks:
      - data  # Floci S3 access only; no DB, no core_mesh, no edge
    # NOT on core_mesh or edge — ETL reads from S3, never calls other services

  # ---------------------------------------------------------------------------
  # P19 — Jupyter Lab: interactive data lake explorer
  #
  #   UI at http://localhost:8888  (no token/password in dev)
  #
  #   Pre-installed: duckdb, pandas, pyarrow, matplotlib, boto3.
  #   The same S3/Floci env vars as yagye_data so DuckDB connects identically
  #   to how the ETL does — query Bronze NDJSON, Silver Parquet, Gold Parquet.
  #
  #   Sample notebook at notebooks/lake_explorer.ipynb (auto-created on first run).
  #
  #   The Athena path (AWS Athena via Floci) is the production-aligned alternative:
  #   use `boto3.client('athena', endpoint_url='http://floci:4566')` from a notebook
  #   once Glue catalogues are registered (P19 roadmap item).
  # ---------------------------------------------------------------------------

  jupyter:
    image: quay.io/jupyter/scipy-notebook:2024-10-07
    restart: unless-stopped
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ""           # no token — dev only, never expose beyond localhost
      # S3 / Floci — same as yagye_data so DuckDB connects identically to ETL
      S3_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      BRONZE_BUCKET: yagye-lake-raw
      SILVER_BUCKET: yagye-lake-silver
      GOLD_BUCKET: yagye-lake-gold
      ML_MODELS_BUCKET: yagye-ml-models
      # MLflow — log experiments from notebooks
      MLFLOW_TRACKING_URI: http://mlflow:5001
    command: >
      /bin/bash -c "
        pip install -q duckdb boto3 mlflow 2>/dev/null &&
        start-notebook.sh --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.notebook_dir=/home/jovyan/notebooks
      "
    ports:
      - "8888:8888"
    volumes:
      - ../../notebooks:/home/jovyan/notebooks   # repo notebooks, edits persist in git
    depends_on:
      - floci
    networks:
      - data  # Floci S3 access; same network as yagye_data

  # ---------------------------------------------------------------------------
  # P20 — MLflow: experiment tracking, model registry, artifact store
  #
  #   UI at http://localhost:5001
  #   Artifact store: /mlflow/artifacts (local volume, proxied via --serve-artifacts)
  #   Backend store:  SQLite in the same named volume
  #
  #   --serve-artifacts makes the tracking server proxy all artifact uploads and
  #   downloads over HTTP — no direct S3 access needed from the host machine.
  #   The host client just points at http://localhost:5001 and the server handles
  #   storage.  In staging/prod, swap the artifact root for s3://... and remove
  #   --serve-artifacts so clients upload directly for throughput.
  # ---------------------------------------------------------------------------

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    restart: unless-stopped
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5001
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root mlflow-artifacts:///mlflow/artifacts
        --artifacts-destination /mlflow/artifacts
        --serve-artifacts
    ports:
      - "5001:5001"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - data

  # ---------------------------------------------------------------------------
  # P20 — Scoring service (FastAPI, port 8000)
  #
  #   POST /score/routing  — provider ranking / go-hold signal
  #   POST /score/risk     — fraud probability
  #   POST /score/reserve  — recommended rolling reserve rate
  #   POST /score/churn    — merchant churn probability
  #   GET  /health         — liveness
  #   GET  /ready          — readiness (checks Redis + model registry)
  #
  #   Runs in shadow mode at P20 (ROUTING_ML_ROLLOUT_PERCENT=0): every call
  #   returns rule-based scores.  ML activates post-P22 after the three gates
  #   in the activation policy pass.
  # ---------------------------------------------------------------------------

  yagye_scoring:
    build:
      context: ../../apps/yagye_scoring
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      # S3 / Floci — model loading at startup
      S3_ENDPOINT_URL: http://floci:4566
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_REGION: us-east-1
      ML_MODELS_BUCKET: yagye-ml-models
      # Redis — real-time provider feature cache
      REDIS_URL: redis://redis:6379/0
      # Shadow mode: both rollout percents stay 0 until post-P22 activation
      ROUTING_ML_ROLLOUT_PERCENT: 0
      RISK_ML_ROLLOUT_PERCENT: 0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      floci:
        condition: service_started
    networks:
      - core_mesh  # Core calls /score/* from PaymentDispatchWorker / VelocityChecker
      - data       # Floci S3 for ONNX model loading at startup

  # Karafka consumer — separate process, scales independently from the web tier.
  # Reads events from Redpanda and writes to portal_* read model tables.
  yagye_portal_karafka:
    build:
      context: ../../apps/yagye_portal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/yagye_portal_development
      SECRET_KEY_BASE: dev_secret_key_base_replace_in_production_min_64_chars_long_abc123
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RAILS_LOG_TO_STDOUT: "true"
      RUBY_IO_BUFFERING: "0"
    command: ["bundle", "exec", "karafka", "server"]
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      yagye_portal:
        condition: service_started
    networks:
      - data  # DB writes + Redpanda consumption only
    # NOT on edge or core_mesh — consumers write to DB, they don't call other services

  # ---------------------------------------------------------------------------
  # P18 — Observability stack
  #
  #   alloy      — Grafana Alloy: OTLP receiver + Prometheus scraper + Docker log shipper
  #   tempo      — Distributed traces backend (OTLP ingestion, Grafana data source)
  #   loki       — Log aggregation backend (Grafana data source)
  #   prometheus — Metrics backend + recording rules + alert evaluation
  #   grafana    — Dashboards at http://localhost:3100  (admin / yagye_dev)
  #
  # All services share the `observability` network. Alloy also sits on `core_mesh`
  # so it can scrape Core's /metrics endpoint and receive OTLP from app containers.
  # ---------------------------------------------------------------------------

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "4317:4317"   # OTLP gRPC (apps → Alloy)
      - "4318:4318"   # OTLP HTTP (apps → Alloy)
      - "12345:12345" # Alloy UI  http://localhost:12345
    networks:
      - observability
      - core_mesh   # Scrapes yagye_core:4000/metrics
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI http://localhost:9090
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: yagye_dev
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3100:3000"   # Grafana UI http://localhost:3100
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

volumes:
  postgres_data:
  redpanda_data:
  rabbitmq_data:
  redis_data:
  floci_data:
  mlflow_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  data:
    driver: bridge
  core_mesh:
    driver: bridge
  edge:
    driver: bridge
  observability:
    driver: bridge
