global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # No alertmanager in local dev; alerts evaluated, not routed.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
    metrics_path: /metrics
