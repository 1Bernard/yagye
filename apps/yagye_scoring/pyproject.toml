[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yagye-scoring"
version = "0.1.0"
description = "ML scoring service for Yagye PSP — routing, risk, reserve, churn"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Config
    "pydantic-settings>=2.5.0",
    # Observability
    "structlog>=24.4.0",
    # Feature store
    "redis[hiredis]>=5.2.0",
    # ML inference
    "onnxruntime>=1.19.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    # S3 model registry
    "boto3>=1.35.0",
    # Resilience
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "boto3-stubs[s3]>=1.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yagye_scoring"]

# ── Ruff (lint + format) ──────────────────────────────────────────────────────

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "TCH",       # flake8-type-checking
    "ANN",       # flake8-annotations
    "RUF",       # ruff-specific
]
ignore = [
    "ANN101",  # missing self annotation
    "ANN102",  # missing cls annotation
]

[tool.ruff.lint.isort]
known-first-party = ["yagye_scoring"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sklearn.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=yagye_scoring --cov-report=term-missing --cov-fail-under=50"
markers = [
    "integration: tests that exercise real I/O paths end-to-end",
]

[tool.coverage.run]
omit = []
