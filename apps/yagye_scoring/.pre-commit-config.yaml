repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        args: [src, tests]
        types: [python]
        pass_filenames: false

      - id: ruff-lint
        name: ruff lint
        language: system
        entry: uv run ruff check
        args: [src, tests]
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        args: [src]
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        language: system
        entry: uv run pytest
        pass_filenames: false
        stages: [pre-push]
